name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build & Package (Installer + Portable ZIP)
        shell: powershell
        run: |
          .\scripts\package.ps1

      - name: Prepare Bilingual Release Notes
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v', 'V').Trim()
          if (-not $ver -or $ver -eq "main") {
            [xml]$proj = Get-Content "APISwitch.csproj"
            $ver = $proj.Project.PropertyGroup.Version
          }

          function Extract-Section($path, $version) {
            if (-not (Test-Path $path)) { return "" }
            $lines = Get-Content -Path $path -Encoding UTF8
            $sb = New-Object System.Text.StringBuilder
            $capturing = $false
            foreach ($line in $lines) {
              if ($line.StartsWith("## ")) {
                if ($capturing) { break }
                if ($line.IndexOf($version, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                  $capturing = $true
                  continue
                }
              }
              if ($capturing) {
                if ($line.Trim() -eq "---") { break }
                [void]$sb.AppendLine($line)
              }
            }
            return $sb.ToString().Trim()
          }

          $zh = Extract-Section "RELEASE_NOTES_zh.md" $ver
          $en = Extract-Section "RELEASE_NOTES.md" $ver
          $tempDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $outPath = Join-Path $tempDir "release_notes_body.md"
          $zhTitle = -join ([char]0x7B80, [char]0x4F53, [char]0x4E2D, [char]0x6587)

          if ($zh -and $en) {
            $body = "## $zhTitle`n<!-- lang:zh -->`n$zh`n<!-- /lang:zh -->`n`n---`n`n## English`n<!-- lang:en -->`n$en`n<!-- /lang:en -->`n"
          } elseif ($zh) {
            $body = "<!-- lang:zh -->`n$zh`n<!-- /lang:zh -->`n"
          } elseif ($en) {
            $body = "<!-- lang:en -->`n$en`n<!-- /lang:en -->`n"
          } else {
            $body = Get-Content -Path "RELEASE_NOTES.md" -Raw -Encoding UTF8
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($outPath, $body, $utf8NoBom)
          Write-Host "Prepared release notes ($($body.Length) chars) at $outPath"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: APISwitch ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release_notes_body.md
          files: |
            Release_Package/APISwitch-Setup-*.exe
            Release_Package/APISwitch-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
