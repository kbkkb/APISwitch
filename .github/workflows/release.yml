name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build & Package (Installer + Portable ZIP)
        shell: powershell
        run: |
          .\scripts\package.ps1

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: APISwitch ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            Release_Package/APISwitch-Setup-*.exe
            Release_Package/APISwitch-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
